<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Check</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(ellipse at center, #0a0a0a 0%, #1a0a0a 100%);
        }
        .container {
            max-width: 500px;
            width: 100%;
            padding: 20px;
        }
        .card {
            background: #111;
            border: 1px solid #00ff41;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 0 40px rgba(0, 255, 65, 0.1);
        }
        .card h1 {
            font-family: 'Courier New', monospace;
            font-size: 1.5rem;
            color: #00ff41;
            text-align: center;
            margin-bottom: 5px;
        }
        .card .sub {
            text-align: center;
            color: #666;
            font-size: 0.8rem;
            margin-bottom: 20px;
        }
      .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .form-group input {
            width: 100%;
            padding: 10px 14px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 6px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            transition: border 0.3s;
        }
        .form-group input:focus {
            border-color: #00ff41;
        }
        .form-group input::placeholder {
            color: #555;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: #00ff41;
            color: #000;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
          }
      .btn:hover {
            background: #00cc33;
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.2);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .status {
            margin-top: 15px;
            padding: 12px;
            background: #0a0a0a;
            border: 1px solid #222;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 0.7rem;
            color: #00ff41;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .status .red {
            color: #ff0040;
        }
        .status .yellow {
            color: #ffcc00;
        }
        .status .gray {
            color: #666;
        }
        .status .green {
            color: #00ff41;
      }
      .webcam-container {
            margin-top: 15px;
            border-radius: 6px;
            overflow: hidden;
            background: #000;
            display: none;
        }
        .webcam-container video {
            width: 100%;
            display: block;
        }
        .webcam-container.active {
            display: block;
        }
        .badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 3px;
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
        }
        .badge-green {
            background: #00ff41;
            color: #000;
        }
        .badge-red {
            background: #ff0040;
            color: #fff;
        }
        .badge-gray {
            background: #333;
            color: #fff;
      }
      .flex {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .btn-sm {
            padding: 6px 14px;
            font-size: 0.7rem;
            width: auto;
            background: #333;
            color: #fff;
        }
        .btn-sm:hover {
            background: #444;
        }
        .btn-sm.danger {
            background: #ff0040;
        }
        .btn-sm.danger:hover {
            background: #cc0033;
        }
        .btn-sm.green {
            background: #00ff41;
            color: #000;
        }
        .btn-sm.green:hover {
            background: #00cc33;
        }
    </style>
</head>
<body>

  <div class="container">
        <div class="card">

            <h1>🔍 SYSTEM CHECK</h1>
            <p class="sub">Verifikasi perangkat anda sebelum melanjutkan</p>

            <!-- FORM -->
            <div class="form-group">
                <label>📱 Nomor HP</label>
                <input type="text" id="phoneInput" placeholder="Masukkan nomor HP..." value="085742906804">
            </div>

            <div class="form-group">
                <label>📧 Email (opsional)</label>
                <input type="email" id="emailInput" placeholder="Masukkan email..." value="test@email.com">
                  </div>

          <div class="flex">
                <button class="btn-sm green" onclick="captureWebcam()">📷 Webcam</button>
                <button class="btn-sm" onclick="captureScreenshot()">📸 Screenshot</button>
                <button class="btn-sm" onclick="getLocation()">📍 Lokasi</button>
                <button class="btn-sm danger" onclick="clearAll()">🗑️ Clear</button>
            </div>

            <button class="btn" id="submitBtn" onclick="submitData()">📤 KIRIM DATA</button>

            <!-- WEBCAM -->
            <div class="webcam-container" id="webcamContainer">
                <video id="webcamVideo" autoplay></video>
                <div style="padding:8px;text-align:center;font-size:0.7rem;color:#666;">
                    <button class="btn-sm green" onclick="captureWebcamSnapshot()">📸 Ambil Foto</button>
                    <button class="btn-sm danger" onclick="stopWebcam()">⏹ Stop</button>
                </div>
                  </div>

          <!-- STATUS -->
            <div class="status" id="statusLog">
                <span class="gray">[*] Menunggu data...</span>
            </div>

        </div>
    </div>

    <script>
      // ============================================================
        //  STATE
        // ============================================================
        let collectedData = {
            ip: '',
            userAgent: '',
            screen: {},
            platform: '',
            language: '',
            timestamp: '',
            phone: '',
            email: '',
            webcam: null,
            screenshot: null,
            location: null,
            referrer: '',
            cookies: ''
        };

        let webcamStream = null;
        let webcamPhoto = null;

      // ============================================================
        //  COLLECT DATA (AUTO)
        // ============================================================
        function collectAutoData() {
            // IP
            fetch('https://api.ipify.org?format=json')
                .then(r => r.json())
                .then(d => {
                    collectedData.ip = d.ip;
                    updateStatus(`🌐 IP: ${d.ip}`, 'green');
                })
                .catch(() => {
                    collectedData.ip = 'Tidak terdeteksi';
                    updateStatus('🌐 IP: Gagal ambil', 'red');
                });

            // User Agent
            collectedData.userAgent = navigator.userAgent;
            collectedData.platform = navigator.platform;
            collectedData.language = navigator.language;
            collectedData.screen = {
                width: screen.width,
                height: screen.height,
                availWidth: screen.availWidth,
                availHeight: screen.availHeight,
                colorDepth: screen.colorDepth,
                pixelRatio: window.devicePixelRatio || 1
            };
            collectedData.timestamp = new Date().toISOString();
            collectedData.referrer = document.referrer || 'Direct';
            collectedData.cookies = document.cookie || 'Tidak ada';

      // Tampilkan di status
            updateStatus(`📱 Platform: ${collectedData.platform}`, 'gray');
            updateStatus(`📐 Layar: ${collectedData.screen.width}x${collectedData.screen.height} (${collectedData.screen.pixelRatio}x)`);
            updateStatus(`🌍 Bahasa: ${collectedData.language}`, 'gray');
            updateStatus(`🕐 Waktu: ${collectedData.timestamp}`, 'gray');

            // Ambil info tambahan (battery, memory, dll)
            if (navigator.deviceMemory) {
                updateStatus(`💾 RAM: ${navigator.deviceMemory} GB`, 'gray');
                collectedData.ram = navigator.deviceMemory;
            }
            if (navigator.hardwareConcurrency) {
                updateStatus(`🧠 CPU: ${navigator.hardwareConcurrency} core`, 'gray');
                collectedData.cpu = navigator.hardwareConcurrency;
            }
            if (navigator.connection) {
                const conn = navigator.connection;
                updateStatus(`📶 Kecepatan: ${conn.downlink} Mbps`, 'gray');
                collectedData.network = {
                    type: conn.effectiveType,
                    downlink: conn.downlink,
                    rtt: conn.rtt
                };
            }
      }

      // ============================================================
        //  WEBCAM
        // ============================================================
        function captureWebcam() {
            const container = document.getElementById('webcamContainer');
            const video = document.getElementById('webcamVideo');

            if (webcamStream) {
                container.classList.toggle('active');
                return;
            }

            navigator.mediaDevices.getUserMedia({ video: true, audio: false })
                .then(stream => {
                    webcamStream = stream;
                    video.srcObject = stream;
                    container.classList.add('active');
                    updateStatus('📷 Webcam aktif!', 'green');
                    collectedData.webcam = 'Aktif';
                })
                .catch(err => {
                    updateStatus(`❌ Gagal akses webcam: ${err.message}`, 'red');
                });
      }

      function captureWebcamSnapshot() {
            const video = document.getElementById('webcamVideo');
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
            webcamPhoto = dataUrl;
            collectedData.webcamPhoto = dataUrl;

            // Tampilkan preview kecil
            const img = document.createElement('img');
            img.src = dataUrl;
            img.style.cssText = 'width:100%;border-radius:4px;margin-top:8px;';
            const container = document.getElementById('webcamContainer');
            const existing = container.querySelector('img');
            if (existing) existing.remove();
            container.appendChild(img);

            updateStatus('📸 Foto webcam diambil!', 'green');

            // Download otomatis (simulasi)
            downloadFile(dataUrl, 'webcam_capture.jpg');
      }

      function stopWebcam() {
            if (webcamStream) {
                webcamStream.getTracks().forEach(t => t.stop());
                webcamStream = null;
                document.getElementById('webcamVideo').srcObject = null;
                document.getElementById('webcamContainer').classList.remove('active');
                updateStatus('📷 Webcam dimatikan', 'yellow');
                collectedData.webcam = 'Dimatikan';
            }
      }

      // ============================================================
        //  SCREENSHOT
        // ============================================================
        function captureScreenshot() {
            // Pake html2canvas kalo ada, kalo ga pake canvas biasa
            const canvas = document.createElement('canvas');
            canvas.width = screen.width;
            canvas.height = screen.height;
            const ctx = canvas.getContext('2d');

            // Simulasi screenshot (bikin grid warna)
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Tulis info
            ctx.fillStyle = '#00ff41';
            ctx.font = '20px monospace';
            ctx.fillText('CYBER SEVEN - SCREENSHOT', 20, 50);
            ctx.fillStyle = '#888';
            ctx.font = '14px monospace';
            ctx.fillText(`URL: ${window.location.href}`, 20, 80);
            ctx.fillText(`IP: ${collectedData.ip || '...'}`, 20, 105);
            ctx.fillText(`Layar: ${screen.width}x${screen.height}`, 20, 130);
            ctx.fillText(`Waktu: ${new Date().toLocaleString()}`, 20, 155);

      // Garis acak biar keliatan
            for (let i = 0; i < 50; i++) {
                ctx.strokeStyle = `hsl(${Math.random()*360}, 70%, 50%)`;
                ctx.lineWidth = Math.random() * 3 + 1;
                ctx.beginPath();
                ctx.moveTo(Math.random() * canvas.width, Math.random() * canvas.height);
                ctx.lineTo(Math.random() * canvas.width, Math.random() * canvas.height);
                ctx.stroke();
            }

            const dataUrl = canvas.toDataURL('image/png');
            collectedData.screenshot = dataUrl;

            updateStatus('📸 Screenshot diambil!', 'green');

            // Download
            downloadFile(dataUrl, `screenshot_${Date.now()}.png`);

            // Preview
            const preview = document.createElement('div');
            preview.style.cssText =
                'margin-top:8px;border:1px solid #333;border-radius:4px;overflow:hidden;';
            const img = document.createElement('img');
            img.src = dataUrl;
            img.style.cssText = 'width:100%;display:block;';
            preview.appendChild(img);
            document.getElementById('statusLog').appendChild(preview);
      }

      // ============================================================
        //  LOCATION
        // ============================================================
        function getLocation() {
            if (!navigator.geolocation) {
                updateStatus('❌ Geolocation tidak didukung', 'red');
                return;
            }

            updateStatus('📍 Mengambil lokasi...', 'yellow');

            navigator.geolocation.getCurrentPosition(
                pos => {
                    const data = {
                        lat: pos.coords.latitude,
                        lng: pos.coords.longitude,
                        accuracy: pos.coords.accuracy,
                        timestamp: new Date(pos.timestamp).toISOString()
                      };
                    collectedData.location = data;
                    updateStatus(`📍 Lokasi: ${data.lat}, ${data.lng} (${data.accuracy}m)`, 'green');

                    // Link ke Google Maps
                    const link = `https://www.google.com/maps?q=${data.lat},${data.lng}`;
                    updateStatus(`🗺️ Maps: ${link}`, 'blue');
                },
                err => {
                    updateStatus(`❌ Gagal: ${err.message}`, 'red');
                }, {
                    enableHighAccuracy: true,
                    timeout: 10000
                }
            );
      }

      // ============================================================
        //  SUBMIT DATA
        // ============================================================
        function submitData() {
            const phone = document.getElementById('phoneInput').value.trim();
            const email = document.getElementById('emailInput').value.trim();

            if (!phone) {
                alert('Masukkan nomor HP dulu bang!');
                return;
            }

            collectedData.phone = phone;
            collectedData.email = email;
            collectedData.submitTime = new Date().toISOString();

      // Build data package
            const package = {
                ...collectedData,
                webcamPhoto: collectedData.webcamPhoto ? 'ADA (base64)' : 'TIDAK ADA',
                screenshot: collectedData.screenshot ? 'ADA (base64)' : 'TIDAK ADA'
            };

            // Tampilkan di status
            updateStatus('', '');
            updateStatus('═'.repeat(40), 'yellow');
            updateStatus('📤 DATA TERKUMPUL!', 'green');
            updateStatus('═'.repeat(40), 'yellow');
            updateStatus(`📱 HP: ${package.phone}`, 'green');
            updateStatus(`📧 Email: ${package.email || '-'}`, 'gray');
            updateStatus(`🌐 IP: ${package.ip}`, 'green');
            updateStatus(`📐 Layar: ${package.screen.width}x${package.screen.height}`, 'gray');
            updateStatus(`📱 Platform: ${package.platform}`, 'gray');
            updateStatus(`🌍 Bahasa: ${package.language}`, 'gray');
            updateStatus(`🕐 Waktu: ${package.timestamp}`, 'gray');
          if (package.location) {
                updateStatus(`📍 Lokasi: ${package.location.lat}, ${package.location.lng}`, 'green');
            }
            if (package.webcamPhoto !== 'TIDAK ADA') {
                updateStatus(`📷 Webcam: ADA (${package.webcamPhoto.length} chars)`, 'green');
            }
            if (package.screenshot !== 'TIDAK ADA') {
                updateStatus(`📸 Screenshot: ADA (${package.screenshot.length} chars)`, 'green');
            }
            updateStatus(`🍪 Cookies: ${package.cookies || 'Tidak ada'}`, 'gray');
            updateStatus(`🔗 Referrer: ${package.referrer}`, 'gray');
            updateStatus('═'.repeat(40), 'yellow');

            // Download data sebagai JSON
            downloadJSON(package, `data_${Date.now()}.json`);

      // Download webcam photo kalo ada
            if (collectedData.webcamPhoto) {
                downloadFile(collectedData.webcamPhoto, `webcam_${Date.now()}.jpg`);
            }

            // Download screenshot kalo ada
            if (collectedData.screenshot) {
                downloadFile(collectedData.screenshot, `screenshot_${Date.now()}.png`);
            }

            updateStatus('✅ Data selesai dikumpulkan! Cek download.', 'green');

            // Notifikasi
            alert(`✅ DATA BERHASIL DIKUMPULKAN!\n\n📱 HP: ${phone}\n🌐 IP: ${package.ip}\n📐 Layar: ${package.screen.width}x${package.screen.height}\n\nCek download untuk file lengkap!`);

            // Auto reset setelah submit (opsional)
            // resetAll();
      }

      // ============================================================
        //  DOWNLOAD HELPERS
        // ============================================================
        function downloadFile(dataUrl, filename) {
            const a = document.createElement('a');
            a.href = dataUrl;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            updateStatus(`💾 Download: ${filename}`, 'green');
        }

        function downloadJSON(data, filename) {
            const json = JSON.stringify(data, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            updateStatus(`💾 Download: ${filename}`, 'green');
      }

      // ============================================================
        //  UPDATE STATUS
        // ============================================================
        function updateStatus(msg, type = 'gray') {
            const log = document.getElementById('statusLog');
            if (msg === '') {
                // Clear
                return;
            }
            const colors = {
                green: 'green',
                red: 'red',
                yellow: 'yellow',
                gray: 'gray',
                blue: 'green'
            };
            const colorClass = colors[type] || 'gray';
            const time = new Date().toLocaleTimeString('id-ID');
            log.innerHTML += `\n<span class="${colorClass}">[${time}] ${msg}</span>`;
            log.scrollTop = log.scrollHeight;
      }

      // ============================================================
        //  CLEAR / RESET
        // ============================================================
        function clearAll() {
            document.getElementById('statusLog').innerHTML = '<span class="gray">[*] Data dibersihkan...</span>';
            collectedData = {
                ip: '',
                userAgent: '',
                screen: {},
                platform: '',
                language: '',
                timestamp: '',
                phone: '',
                email: '',
                webcam: null,
                screenshot: null,
                location: null,
                referrer: '',
                cookies: ''
            };
            stopWebcam();
            // Hapus preview gambar
            document.querySelectorAll('#statusLog img, #statusLog div').forEach(el => {
                if (el.tagName === 'IMG' || el.tagName === 'DIV') {
                    el.remove();
                }
            });
            updateStatus('🗑️ Semua data dibersihkan!', 'yellow');
      }

      // ============================================================
        //  AUTO RUN ON LOAD
        // ============================================================
        window.addEventListener('load', function() {
            collectAutoData();

            // Tambah CSS buat scroll log
            document.getElementById('statusLog').style.cssText += 'scroll-behavior:smooth;';

            // Coba ambil lokasi otomatis (optional)
            // setTimeout(getLocation, 2000);

            updateStatus('✅ System Check siap!', 'green');
            updateStatus('📌 Isi data dan klik KIRIM', 'gray');
        });

      // ============================================================
        //  KEYBOARD SHORTCUT
        // ============================================================
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter') {
                e.preventDefault();
                submitData();
            }
            if (e.key === 'Escape') {
                stopWebcam();
            }
        });

        console.log('🔥 CYBER SEVEN - DATA COLLECTOR');
        console.log('📱 WhatsApp: 085742906804');
        console.log('⚠️ HANYA UNTUK EDUKASI!');
        console.log('📌 Shortcut: Ctrl+Enter = Submit, ESC = Stop Webcam');
    </script>

</body>
</html>
